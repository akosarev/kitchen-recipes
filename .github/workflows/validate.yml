name: Validate recipes

on:
  pull_request:
  push:
    branches-ignore: [main, app] # main validates in pages.yml before publishing; app holds no recipes

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate recipes
        run: node scripts/validate.mjs
